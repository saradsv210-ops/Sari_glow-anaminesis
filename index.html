<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Sari Glow · Ficha de Anamnesis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/4.1.7/signature_pad.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --cream:#FAF6F1;
    --cream-deep:#F1E9E0;
    --brown:#5C4433;
    --brown-deep:#3B2A1F;
    --rose:#C48979;
    --rose-soft:#E6C9BE;
    --taupe:#948273;
    --ink:#2E2420;
    --line:#E4D9CC;
    --ok:#7C8B6F;
    --err:#B2523F;
    --radius:18px;
    --shadow:0 12px 30px -18px rgba(59,42,31,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  .app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:40px;}
  .hidden{display:none !important;}

  /* ---------- Landing ---------- */
  .landing{padding:64px 28px 40px;text-align:center;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
  .landing .brandmark{
    width:64px;height:64px;border-radius:50%;
    background:linear-gradient(135deg,var(--rose-soft),var(--rose));
    margin-bottom:22px;display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;color:#fff;font-size:26px;
  }
  .brand-logo-landing{width:148px;height:auto;margin-bottom:22px;}
  .brand-logo-admin{height:30px;width:auto;display:block;}
  .landing .brand-name{font-size:13px;letter-spacing:.16em;color:var(--taupe);margin-bottom:6px;}
  .landing h1{font-size:34px;font-weight:500;color:var(--brown-deep);margin:0 0 18px;line-height:1.15;}
  .landing p{font-size:15.5px;line-height:1.65;color:var(--brown);max-width:400px;margin:0 auto 34px;}
  .btn-primary{
    background:var(--brown-deep);color:#fff;border:none;
    padding:17px 30px;border-radius:100px;font-size:16px;font-weight:600;
    font-family:'Inter',sans-serif;cursor:pointer;width:100%;max-width:320px;
    box-shadow:var(--shadow);transition:transform .15s ease, background .2s ease;
  }
  .btn-primary:active{transform:scale(.98);}
  .btn-primary:hover{background:var(--brown);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .landing .fineprint{margin-top:16px;font-size:12.5px;color:var(--taupe);}
  .landing .spacer{flex:1;}
  .landing .footer-key{margin-top:auto;padding-top:40px;}

  /* ---------- Wizard shell ---------- */
  .wizard{padding:22px 22px 120px;}
  .progress-wrap{margin-bottom:28px;}
  .progress-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .progress-label .step-num{font-family:'Fraunces',serif;font-size:13px;color:var(--rose);letter-spacing:.05em;}
  .progress-label .step-name{font-size:12.5px;color:var(--taupe);text-transform:none;}
  .progress-bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--rose);border-radius:4px;transition:width .35s ease;}

  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px;margin-bottom:16px;}
  .card h2{font-size:21px;font-weight:500;color:var(--brown-deep);margin:0 0 6px;}
  .card .card-sub{font-size:13.5px;color:var(--taupe);margin:0 0 20px;}

  .field{margin-bottom:20px;}
  .field label{display:block;font-size:14px;font-weight:600;color:var(--brown-deep);margin-bottom:8px;}
  .field .hint{font-size:12.5px;color:var(--taupe);margin-top:6px;}
  input[type=text],input[type=tel],input[type=email],input[type=date],textarea,select{
    width:100%;padding:14px 15px;border:1.5px solid var(--line);border-radius:12px;
    font-size:16px;font-family:'Inter',sans-serif;color:var(--ink);background:#fff;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--rose);}
  textarea{min-height:90px;resize:vertical;}

  .yn{display:flex;gap:12px;}
  .yn button{
    flex:1;padding:15px 10px;border-radius:12px;border:1.5px solid var(--line);
    background:#fff;font-size:15px;font-weight:600;color:var(--brown);cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .yn button.active-yes{background:var(--brown-deep);border-color:var(--brown-deep);color:#fff;}
  .yn button.active-no{background:var(--cream-deep);border-color:var(--rose);color:var(--brown-deep);}
  .followup{margin-top:12px;}

  .check-row{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line);}
  .check-row:first-of-type{border-top:none;}
  .check-row input[type=checkbox]{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--brown-deep);}
  .check-row .check-text{font-size:14.5px;line-height:1.5;color:var(--ink);}

  .radio-pair{display:flex;flex-direction:column;gap:10px;}
  .radio-opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;}
  .radio-opt.selected{border-color:var(--rose);background:var(--cream-deep);}
  .radio-opt input{width:20px;height:20px;accent-color:var(--brown-deep);}

  .nav-row{display:flex;gap:12px;margin-top:6px;}
  .btn-secondary{
    flex:none;background:transparent;border:1.5px solid var(--line);color:var(--brown);
    padding:15px 20px;border-radius:100px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .nav-row .btn-primary{padding:15px 20px;}
  .error-banner{background:#FBECE7;border:1px solid var(--err);color:var(--err);border-radius:12px;padding:12px 15px;font-size:13.5px;margin-bottom:16px;}

  /* signature */
  .sig-wrap{border:1.5px dashed var(--taupe);border-radius:14px;background:#fff;position:relative;overflow:hidden;}
  .sig-wrap canvas{display:block;width:100%;height:220px;touch-action:none;}
  .sig-line{position:absolute;left:20px;right:20px;bottom:44px;border-top:1px dashed var(--line);}
  .sig-hint{position:absolute;top:10px;left:16px;font-size:12px;color:var(--taupe);}
  .sig-actions{display:flex;justify-content:space-between;margin-top:10px;}
  .link-btn{background:none;border:none;color:var(--brown);font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;padding:6px;}

  .review-box{background:var(--cream-deep);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--brown);margin-bottom:16px;}

  /* success */
  .success{padding:70px 26px;text-align:center;}
  .success .icon{width:72px;height:72px;border-radius:50%;background:var(--rose-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:30px;color:var(--brown-deep);}
  .success h1{font-size:26px;color:var(--brown-deep);margin:0 0 10px;}
  .success p{color:var(--brown);font-size:14.5px;line-height:1.6;margin-bottom:28px;}

  /* footer key */
  .footer-key-btn{
    background:none;border:none;color:var(--line);font-size:15px;cursor:pointer;
    padding:14px;opacity:.55;
  }

  /* modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(46,36,32,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal-backdrop.center{align-items:center;}
  .modal{background:#fff;border-radius:20px 20px 0 0;padding:26px 22px 34px;width:100%;max-width:560px;}
  .modal-backdrop.center .modal{border-radius:20px;}
  .modal h3{margin:0 0 8px;color:var(--brown-deep);}
  .modal p{font-size:14px;color:var(--brown);line-height:1.55;margin:0 0 18px;}

  /* ---------- Admin ---------- */
  .admin{background:var(--brown-deep);min-height:100vh;color:#fff;}
  .admin-app{max-width:920px;margin:0 auto;padding:0 0 60px;}
  .admin-top{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid rgba(255,255,255,.1);}
  .admin-top .brand{font-family:'Fraunces',serif;font-size:18px;letter-spacing:.03em;}
  .admin-top .logout{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;padding:8px 14px;border-radius:100px;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;}
  .admin-tabs{display:flex;gap:6px;padding:14px 16px;overflow-x:auto;}
  .admin-tabs button{
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#E9DFD5;
    padding:9px 15px;border-radius:100px;font-size:13px;white-space:nowrap;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .admin-tabs button.active{background:var(--rose);border-color:var(--rose);color:var(--brown-deep);font-weight:700;}
  .admin-body{padding:8px 16px 40px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
  .stat-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;}
  .stat-card .num{font-family:'Fraunces',serif;font-size:26px;}
  .stat-card .lbl{font-size:12px;color:#CBB9AA;margin-top:2px;}
  .admin-section-title{font-family:'Fraunces',serif;font-size:17px;margin:22px 0 12px;color:#F3E9DF;}
  .search-input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-size:15px;margin-bottom:12px;}
  .search-input::placeholder{color:#B7A596;}
  .filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .filter-row select{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:9px 10px;font-size:12.5px;font-family:'Inter',sans-serif;}
  .patient-row{
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;
    padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  }
  .patient-row:hover{background:rgba(255,255,255,.09);}
  .patient-row .pname{font-weight:600;font-size:15px;}
  .patient-row .pmeta{font-size:12.5px;color:#C9B8A9;margin-top:3px;}
  .patient-row .chev{color:#C9B8A9;}
  .empty-state{color:#C9B8A9;font-size:13.5px;padding:30px 10px;text-align:center;}

  .detail-back{background:none;border:none;color:#E9DFD5;font-size:14px;margin-bottom:14px;cursor:pointer;font-family:'Inter',sans-serif;}
  .detail-header{margin-bottom:18px;}
  .detail-header h2{font-family:'Fraunces',serif;font-size:22px;margin:0 0 4px;}
  .detail-header .sub{color:#C9B8A9;font-size:13px;}
  .detail-actions{display:flex;gap:8px;margin:14px 0 22px;flex-wrap:wrap;}
  .detail-actions button{
    background:var(--rose);color:var(--brown-deep);border:none;padding:11px 16px;border-radius:100px;
    font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .detail-actions button.ghost{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
  .info-item{background:rgba(255,255,255,.05);border-radius:12px;padding:12px 14px;}
  .info-item .k{font-size:11px;color:#B7A596;text-transform:uppercase;letter-spacing:.05em;}
  .info-item .v{font-size:14.5px;margin-top:3px;}
  .ficha-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px;margin-bottom:12px;}
  .ficha-card .fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .ficha-card .fservice{font-weight:700;font-size:14.5px;}
  .ficha-card .fdate{font-size:12px;color:#C9B8A9;}
  .ficha-card .fdetails{font-size:13px;color:#DCCFC2;line-height:1.6;}
  .ficha-card details summary{cursor:pointer;color:var(--rose);font-size:12.5px;margin-top:8px;}
  .sig-thumb{max-width:220px;background:#fff;border-radius:8px;margin-top:10px;padding:6px;}
  .consent-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .tag{font-size:11px;background:rgba(124,139,111,.25);color:#B9E2A6;padding:4px 9px;border-radius:100px;}
  .tag.warn{background:rgba(178,82,63,.25);color:#F0B3A4;}

  .bday-row{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 16px;margin-bottom:9px;}
  .bday-row .days{font-family:'Fraunces',serif;font-size:20px;color:var(--rose);}
  .bday-row .dayslbl{font-size:10.5px;color:#C9B8A9;}

  .login-screen{min-height:100vh;background:var(--brown-deep);display:flex;align-items:center;justify-content:center;padding:26px;}
  .login-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:30px 26px;max-width:340px;width:100%;text-align:center;}
  .login-box h2{color:#fff;font-family:'Fraunces',serif;margin:0 0 6px;}
  .login-box p{color:#C9B8A9;font-size:13px;margin:0 0 20px;}
  .login-box input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:20px;text-align:center;letter-spacing:.3em;margin-bottom:14px;}
  .login-box .btn-primary{max-width:none;}
  .login-err{color:#F0B3A4;font-size:12.5px;margin-bottom:10px;min-height:16px;}
</style>
</head>

function todayISO(){ return new Date().toISOString().slice(0,10); }
function uid(){ return 'f_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function calcEdad(fechaISO){
  if(!fechaISO) return null;
  const b = new Date(fechaISO+"T00:00:00");
  if(isNaN(b)) return null;
  const t = new Date();
  let age = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if(m < 0 || (m===0 && t.getDate() < b.getDate())) age--;
  return age;
}

function servicioCategoria(servicio){
  const s = (servicio||"").toLowerCase();
  if(s.includes("pestañ")) return "pestanas";
  if(s.includes("labio")) return "labios";
  if(s.includes("limpieza") || s.includes("hidrataci") || s.includes("anti-age") || s.includes("manchas") || s.includes("calma")) return "facial";
  return null;
}

// Storage helpers — Supabase (Postgres) vía API REST (PostgREST)
// ---------------------------------------------------------------------------
// submitFichaToServer(patient, ficha): guarda paciente + ficha vía Netlify
// Function (que a su vez usa Netlify Blobs). Mismo DNI = mismo paciente:
// la función hace upsert, nunca crea un paciente duplicado.
// ---------------------------------------------------------------------------
async function submitFichaToServer(patient, ficha){
  const res = await fetch(FN_SUBMIT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ patient, ficha })
  });
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    throw new Error((data && data.error) ? data.error : 'No se pudo guardar la ficha (código '+res.status+').');
  }
  return data;
}

// fetchAdminData(password): la contraseña se valida del lado del servidor
// (variable de entorno ADMIN_PASSWORD en Netlify), nunca en este archivo.
async function fetchAdminData(password){
  const res = await fetch(FN_ADMIN, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password })
  });
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(res.status === 401){
    throw new Error('WRONG_PASSWORD');
  }
  if(!res.ok){
    throw new Error((data && data.error) ? data.error : 'No se pudo conectar con el servidor (código '+res.status+').');
  }
  return (data && data.patients) ? data.patients : [];
}

const root = document.getElementById('app');

function render(){
  if(state.screen === 'admin' || state.screen === 'admin-login'){
    root.className = 'app';
    root.innerHTML = '';
    root.appendChild(state.screen==='admin-login' ? renderAdminLogin() : renderAdmin());
  } else {
    root.className = 'app';
    root.innerHTML = '';
    if(state.screen==='landing') root.appendChild(renderLanding());
    if(state.screen==='wizard') root.appendChild(renderWizard());
    if(state.screen==='success') root.appendChild(renderSuccess());
  }
  if(state.modal) root.appendChild(renderModal());
}

function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if(k==='html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c=>{ if(c) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}

function renderWizard(){
  const wrap = el('div',{class:'wizard'});
  const totalSteps = 6;
  const pct = Math.round(((state.step)/(totalSteps-1))*100);
  const pw = el('div',{class:'progress-wrap'});
  pw.appendChild(el('div',{class:'progress-label'},[
    el('span',{class:'step-num'},['0'+(state.step+1)+' / 0'+totalSteps]),
    el('span',{class:'step-name'},[STEP_NAMES[state.step]])
  ]));
  const bar = el('div',{class:'progress-bar'});
  bar.appendChild(el('div',{class:'progress-fill', style:'width:'+pct+'%'}));
  pw.appendChild(bar);
  wrap.appendChild(pw);

  if(state.errors.length){
    wrap.appendChild(el('div',{class:'error-banner'},['Falta completar: ' + state.errors.join(', ') + '.']));
  }

  const stepRenderers = [stepPersonal, stepAntecedentes, stepHabitos, stepConsentimientos, stepFirma, null];
  if(state.step < 4) wrap.appendChild(stepRenderers[state.step]());
  else if(state.step === 4) wrap.appendChild(stepFirma());

  wrap.appendChild(renderNav());
  return wrap;
}

function renderNav(){
  const row = el('div',{class:'nav-row'});
  if(state.step > 0){
    row.appendChild(el('button',{class:'btn-secondary', onclick:()=>{ state.step--; state.errors=[]; render(); }},['← Anterior']));
  } else {
    row.appendChild(el('button',{class:'btn-secondary', onclick:()=>{ state.screen='landing'; render(); }},['← Volver']));
  }
  const isLast = state.step === 4;
  const finishBtn = el('button',{class:'btn-primary', style:'flex:1', onclick:()=> isLast ? handleFinish() : handleNext()},[isLast ? (isSaving?'Guardando…':'Finalizar ficha') : 'Continuar']);
  if(isLast && isSaving) finishBtn.disabled = true;
  row.appendChild(finishBtn);
  return row;
}

function ynGroup(container, obj, key, question, followupKey, followupLabel){
  const f = el('div',{class:'field'});
  f.appendChild(el('label',{},[question]));
  const yn = el('div',{class:'yn'});
  const yesBtn = el('button',{onclick:(e)=>{ e.preventDefault(); obj[key]=true; render(); focusLater(); }},['Sí']);
  const noBtn = el('button',{onclick:(e)=>{ e.preventDefault(); obj[key]=false; if(followupKey) obj[followupKey]=""; render(); }},['No']);

  if(obj[key]===false) noBtn.classList.add('active-no');
  yn.appendChild(yesBtn); yn.appendChild(noBtn);

    const ta = el('textarea',{class:'followup', placeholder:'Contanos brevemente cuál.', oninput:(e)=>{ obj[followupKey]=e.target.value; }});
    ta.value = obj[followupKey]||"";
    f.appendChild(ta);
  }
  container.appendChild(f);
}

function resizeCanvas(canvas){
  const ratio = Math.max(window.devicePixelRatio||1,1);
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * ratio;
  canvas.height = 220 * ratio;
  canvas.getContext('2d').scale(ratio, ratio);
}
function openConfirmSignature(){
  if(!signaturePad || signaturePad.isEmpty()){
    state.errors = ['la firma'];
    render();
    return;
  }
  state.modal = {type:'confirmSig'};

}

function handleNext(){
  const missing = validateStep(state.step);
  if(missing.length){ state.errors = missing; render(); return; }
  state.errors = [];
  state.step++;
  render();
}

function validateStep(step){
  const missing = [];
  if(step===0){
    const p = state.form.personal;
    if(!p.nombre) missing.push('Nombre y apellido');
    if(!p.dni) missing.push('DNI');
    if(!p.fechaNacimiento) missing.push('Fecha de nacimiento');
    else if(calcEdad(p.fechaNacimiento)===null || calcEdad(p.fechaNacimiento)<0) missing.push('Fecha de nacimiento válida');
    if(!p.telefono) missing.push('Teléfono');
    if(!p.servicio) missing.push('Servicio');
  }
  if(step===3){
    const cs = state.form.consentimientos;
    if(!(cs.veracidad && cs.indicaciones && cs.cambios && cs.cuidados)) missing.push('los consentimientos obligatorios');
    if(!cs.fotos) missing.push('la autorización de fotografías');
  }
  return missing;
}

let isSaving = false;
async function handleFinish(){
  if(isSaving) return; // evita doble envío / pacientes duplicados por doble tap

  const missing = [];
  if(!state.form.firma) missing.push('la firma');
  missing.push(...validateStep(3));
  if(missing.length){ state.errors = [...new Set(missing)]; render(); return; }

  isSaving = true;
  state.errors = [];
  render(); // re-renderiza para mostrar "Guardando..."

  try{
    const fichaId = uid();
    const now = new Date();
    const dniNorm = normDni(state.form.personal.dni);
    const ficha = {
      fichaId,
      createdAt: now.toISOString(),
      servicio: state.form.personal.servicio,
      fechaConsulta: state.form.personal.fechaConsulta,
      antecedentes: state.form.antecedentes,
      habitos: state.form.habitos,
      especifico: state.form.especifico,
      consentimientos: state.form.consentimientos,
      consentVersion: CONSENT_VERSION,
      firma: state.form.firma,
      firmaConfirmedAt: now.toISOString()
    };

    // Mismo DNI = mismo paciente: el servidor hace upsert, nunca crea
    // un paciente duplicado, y la ficha se suma a su historial.
    await submitFichaToServer({
      dni: dniNorm,
      nombre: state.form.personal.nombre,
      fechaNacimiento: state.form.personal.fechaNacimiento,
      telefono: state.form.personal.telefono,
      email: state.form.personal.email,
      domicilio: state.form.personal.domicilio
    }, ficha);

    state.savedFichaSummary = { nombre: state.form.personal.nombre, servicio: ficha.servicio, fecha: ficha.fechaConsulta, dni: dniNorm };
    state.screen = 'success';
  }catch(e){
    state.errors = [ (e && e.message) ? e.message : 'no se pudo guardar la ficha. Revisá tu conexión e intentá de nuevo' ];
  }finally{
    isSaving = false;
    render();
  }
}

  const today = new Date(); today.setHours(0,0,0,0);
  return state.admin.patients.filter(p=>p.fechaNacimiento).map(p=>{
    const b = new Date(p.fechaNacimiento+"T00:00:00");
    let next = new Date(today.getFullYear(), b.getMonth(), b.getDate());
    if(next < today) next = new Date(today.getFullYear()+1, b.getMonth(), b.getDate());
    const days = Math.round((next-today)/(1000*60*60*24));
    const turningAge = next.getFullYear() - b.getFullYear();
    return {patient:p, days, turningAge, next};
  }).sort((a,b)=>a.days-b.days);
}

function renderAdminBirthdays(){
  const c = el('div',{});
  c.appendChild(el('div',{class:'admin-section-title'},['🎂 Próximos cumpleaños']));
  const list = upcomingBirthdays();
  if(!list.length) c.appendChild(el('div',{class:'empty-state'},['No hay fechas de nacimiento registradas todavía.']));
  list.forEach(item=>{
    const row = el('div',{class:'bday-row', onclick:()=>{ state.admin.selectedDni=item.patient.dni; state.admin.tab='detail'; render(); }});
    const left = el('div',{});
    left.appendChild(el('div',{class:'pname'},[item.patient.nombre]));
    left.appendChild(el('div',{class:'pmeta'},[formatBirthLong(item.patient.fechaNacimiento) + ' · cumple '+item.turningAge+' años']));
    row.appendChild(left);
    const right = el('div',{style:'text-align:right;'});
    right.appendChild(el('div',{class:'days'},[item.days===0?'Hoy':String(item.days)]));
    right.appendChild(el('div',{class:'dayslbl'},[item.days===0?'':'días']));
    row.appendChild(right);
    c.appendChild(row);
  });
  return c;
}
function formatBirthLong(iso){
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString('es-AR',{day:'numeric',month:'long'});
}

function renderAdminDetail(){
  const c = el('div',{});
  const p = state.admin.patients.find(x=>x.dni===state.admin.selectedDni);
  if(!p){ c.appendChild(el('div',{class:'empty-state'},['Paciente no encontrado.'])); return c; }

  c.appendChild(el('button',{class:'detail-back', onclick:()=>{ state.admin.tab='pacientes'; render(); }},['← Volver a pacientes']));
  const header = el('div',{class:'detail-header'});
  header.appendChild(el('h2',{},[p.nombre]));
  const edad = calcEdad(p.fechaNacimiento);
  header.appendChild(el('div',{class:'sub'},['DNI '+p.dni + (edad!==null?' · '+edad+' años':'')]));
  c.appendChild(header);

  const grid = el('div',{class:'info-grid'});
  grid.appendChild(infoItem('Teléfono', p.telefono||'—'));
  grid.appendChild(infoItem('Email', p.email||'—'));
  grid.appendChild(infoItem('Fecha de nacimiento', p.fechaNacimiento?formatBirthLong(p.fechaNacimiento):'—'));
  grid.appendChild(infoItem('Domicilio', p.domicilio||'—'));
  c.appendChild(grid);

  const actions = el('div',{class:'detail-actions'});
  actions.appendChild(el('button',{onclick:()=>exportPatientFullPDF(p)},['⬇ PDF historial completo']));
  actions.appendChild(el('button',{class:'ghost', onclick:()=>exportPatientsCSV()},['⬇ CSV pacientes']));
  c.appendChild(actions);

  c.appendChild(el('div',{class:'admin-section-title'},['Historial de fichas ('+p.fichas.length+')']));
  const sorted = p.fichas.slice().sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  sorted.forEach((f,i)=>{
    c.appendChild(renderFichaCard(p, f, sorted.length-i));
  });
  return c;
}
function infoItem(k,v){
  const box = el('div',{class:'info-item'});
  box.appendChild(el('div',{class:'k'},[k]));
  box.appendChild(el('div',{class:'v'},[v]));
  return box;
}

function renderFichaCard(patient, f, num){
  const box = el('div',{class:'ficha-card'});
  const head = el('div',{class:'fhead'});
  head.appendChild(el('div',{class:'fservice'},['Ficha '+num+' — '+f.servicio]));
  head.appendChild(el('div',{class:'fdate'},[formatDate(f.createdAt)]));
  box.appendChild(head);

  const tags = el('div',{class:'consent-tags'});
  const allConsent = f.consentimientos.veracidad && f.consentimientos.indicaciones && f.consentimientos.cambios && f.consentimientos.cuidados;
  tags.appendChild(el('span',{class:'tag'+(allConsent?'':' warn')},[allConsent?'✓ Consentimientos aceptados':'Consentimientos incompletos']));
  tags.appendChild(el('span',{class:'tag'+(f.consentimientos.fotos==='autorizo'?'':' warn')},[f.consentimientos.fotos==='autorizo'?'✓ Fotos autorizadas':'✕ Fotos no autorizadas']));
  tags.appendChild(el('span',{class:'tag'},['v'+f.consentVersion]));
  box.appendChild(tags);

  const det = el('details',{});
  det.appendChild(el('summary',{},['Ver antecedentes, hábitos y firma']));
  const body = el('div',{class:'fdetails'});
  body.appendChild(summaryYesNoBlock('Antecedentes', f.antecedentes));
  body.appendChild(summaryYesNoBlock('Hábitos', f.habitos));
  if(f.especifico && Object.keys(f.especifico).length){
    body.appendChild(summaryYesNoBlock('Preguntas específicas del servicio', f.especifico));
  }
  det.appendChild(body);
  if(f.firma){
    const img = el('img',{src:f.firma, class:'sig-thumb'});
    det.appendChild(img);
  }
  det.appendChild(el('div',{style:'margin-top:10px;'},[
    el('button',{class:'link-btn', style:'color:var(--rose);padding:0;', onclick:()=>exportFichaPDF(patient,f)},['⬇ Descargar ficha en PDF'])
  ]));
  box.appendChild(det);
  return box;
}

function summaryYesNoBlock(title, obj){
  const wrap = el('div',{style:'margin-bottom:10px;'});
  wrap.appendChild(el('div',{style:'font-weight:700;color:#F3E9DF;margin-bottom:4px;'},[title]));
  const lines = [];
  for(const k in obj){
    if(k.toLowerCase().includes('detalle')) continue;
    const val = obj[k];
    if(val===true) lines.push(humanKey(k)+': Sí' + (obj[k+'Detalle']? ' — '+obj[k+'Detalle']:''));
    else if(val===false) lines.push(humanKey(k)+': No');
    else if(typeof val==='string' && val) lines.push(humanKey(k)+': '+val);
  }
  wrap.appendChild(el('div',{},[lines.join(' · ') || 'Sin datos']));
  return wrap;
}
function humanKey(k){
  return k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase());
}

// ---------------------------------------------------------------------------
// Exports: CSV & PDF
// ---------------------------------------------------------------------------
function downloadBlob(filename, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportPatientsCSV(){
  const rows = [['Nombre','DNI','Fecha de nacimiento','Teléfono','Email','Domicilio','Cantidad de fichas','Último servicio']];
  state.admin.patients.forEach(p=>{
    const last = p.fichas.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))[0];
    rows.push([p.nombre,p.dni,p.fechaNacimiento,p.telefono,p.email,p.domicilio,String(p.fichas.length), last?last.servicio:'']);
  });
  const csv = rows.map(r=> r.map(v=> '"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  downloadBlob('sariglow-pacientes.csv', "\uFEFF"+csv, 'text/csv;charset=utf-8');
}

function exportFichaPDF(patient, ficha){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  let y = 50;
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('Sari Glow · Ficha de Anamnesis', 40, y); y+=26;
  doc.setDrawColor(196,137,121); doc.line(40,y,555,y); y+=22;

  doc.setFontSize(11); doc.setFont('helvetica','normal');
  y = pdfLine(doc,y,'Paciente: '+patient.nombre);
  y = pdfLine(doc,y,'DNI: '+patient.dni+'   Fecha de nacimiento: '+(patient.fechaNacimiento||'—'));
  y = pdfLine(doc,y,'Teléfono: '+(patient.telefono||'—')+'   Email: '+(patient.email||'—'));
  y = pdfLine(doc,y,'Servicio: '+ficha.servicio+'   Fecha: '+formatDate(ficha.createdAt));
  y += 10;

  y = pdfSection(doc,y,'Antecedentes de salud', ficha.antecedentes);
  y = pdfSection(doc,y,'Hábitos y cuidados', ficha.habitos);
  if(ficha.especifico && Object.keys(ficha.especifico).length){
    y = pdfSection(doc,y,'Preguntas específicas del servicio', ficha.especifico);
  }

  if(y > 650){ doc.addPage(); y = 50; }
  doc.setFont('helvetica','bold'); doc.text('Consentimientos', 40, y); y+=16;
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
  const c = ficha.consentimientos;
  y = pdfLine(doc,y,(c.veracidad?'[X] ':'[ ] ')+'Declara que la información es verdadera y completa.');
  y = pdfLine(doc,y,(c.indicaciones?'[X] ':'[ ] ')+'Declara haber leído indicaciones y contraindicaciones.');
  y = pdfLine(doc,y,(c.cambios?'[X] ':'[ ] ')+'Se compromete a informar cambios relevantes de salud.');
  y = pdfLine(doc,y,(c.cuidados?'[X] ':'[ ] ')+'Acepta las indicaciones de cuidado posteriores.');
  y = pdfLine(doc,y, 'Fotografías: ' + (c.fotos==='autorizo' ? 'AUTORIZADAS' : 'NO AUTORIZADAS'));
  y = pdfLine(doc,y, 'Versión del consentimiento aceptado: v'+ficha.consentVersion);
  y += 14;

  if(y > 620){ doc.addPage(); y = 50; }
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Firma digital del paciente', 40, y); y+=10;
  if(ficha.firma){
    try{ doc.addImage(ficha.firma, 'PNG', 40, y, 220, 90); }catch(e){}
    y += 100;
  }
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(120,105,95);
  y = pdfLine(doc,y,'Fecha y hora de aceptación: '+new Date(ficha.firmaConfirmedAt).toLocaleString('es-AR'));
  y = pdfLine(doc,y,'Esta firma corresponde a la ficha identificada como: '+ficha.fichaId);
  y = pdfLine(doc,y,'Registro de aceptación — no constituye firma manuscrita certificada.');

  doc.save('ficha-'+patient.nombre.replace(/\s+/g,'-')+'-'+ficha.fichaId+'.pdf');
}

function exportPatientFullPDF(patient){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  let y = 50;
  doc.setFont('helvetica','bold'); doc.setFontSize(17);
  doc.text('Sari Glow · Historial de paciente', 40, y); y+=26;
  doc.setDrawColor(196,137,121); doc.line(40,y,555,y); y+=22;
  doc.setFontSize(11); doc.setFont('helvetica','normal');
  y = pdfLine(doc,y,'Paciente: '+patient.nombre);
  y = pdfLine(doc,y,'DNI: '+patient.dni+'   Fecha de nacimiento: '+(patient.fechaNacimiento||'—'));
  y = pdfLine(doc,y,'Teléfono: '+(patient.telefono||'—')+'   Email: '+(patient.email||'—'));
  y = pdfLine(doc,y,'Total de fichas: '+patient.fichas.length);
  y += 10;

  const sorted = patient.fichas.slice().sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  sorted.forEach((ficha, idx)=>{
    if(y > 640){ doc.addPage(); y = 50; }
    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text('Ficha '+(idx+1)+' — '+ficha.servicio+' ('+formatDate(ficha.createdAt)+')', 40, y); y+=18;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    y = pdfSection(doc,y,'Antecedentes', ficha.antecedentes, true);
    y = pdfSection(doc,y,'Hábitos', ficha.habitos, true);
    const c = ficha.consentimientos;
    y = pdfLine(doc,y, 'Consentimientos: '+(c.veracidad&&c.indicaciones&&c.cambios&&c.cuidados?'Aceptados':'Incompletos')+'   Fotos: '+(c.fotos==='autorizo'?'Autorizadas':'No autorizadas'));
    if(ficha.firma){
      if(y > 620){ doc.addPage(); y = 50; }
      doc.setFontSize(9.5); doc.text('Firma:', 40, y); y+=6;
      try{ doc.addImage(ficha.firma,'PNG',40,y,160,65); }catch(e){}
      y += 75;
    }
    y += 14;
  });
  doc.save('historial-'+patient.nombre.replace(/\s+/g,'-')+'.pdf');
}

function pdfLine(doc,y,text){
  doc.text(text, 40, y);
  return y + 16;
}
function pdfSection(doc,y,title,obj,compact){
  if(y > 700){ doc.addPage(); y=50; }
  doc.setFont('helvetica','bold'); doc.setFontSize(compact?10.5:12);
  doc.text(title, 40, y); y+=15;
  doc.setFont('helvetica','normal'); doc.setFontSize(compact?9:10);
  const lines = [];
  for(const k in obj){
    if(k.toLowerCase().includes('detalle')) continue;
    const val = obj[k];
    let line = null;
    if(val===true) line = humanKey(k)+': Sí'+(obj[k+'Detalle']?' — '+obj[k+'Detalle']:'');
    else if(val===false) line = humanKey(k)+': No';
    else if(typeof val==='string' && val) line = humanKey(k)+': '+val;
    if(line) lines.push(line);
  }
  const wrapped = doc.splitTextToSize(lines.join('   |   ') || 'Sin datos', 500);
  wrapped.forEach(l=>{
    if(y>750){ doc.addPage(); y=50; }
    doc.text(l,40,y); y+=13;
  });
  return y+10;
}
